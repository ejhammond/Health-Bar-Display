# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# The JDK is not pinned here: java.toolchain in multiloader-common.gradle already targets
# java_version below, and Gradle provisions it. Set org.gradle.java.home in your own
# ~/.gradle/gradle.properties if you need to pin the daemon JVM - an absolute path in a
# committed file only works on the machine it was written on.

# Minecraft & Mod
minecraft_version=26.2
minecraft_version_range=[26.2, 26.3)
neo_form_version=26.2-1
java_version=25

# NeoForge
neoforge_version=26.2.0.7-beta
neoforge_loader_version_range=[4,)

# Fabric
fabric_loader_version=0.19.3
fabric_version=0.153.0+26.2
modmenu_version=20.0.1
cloth_config_version=26.2.155

# Mod Properties
mod_id=mobhealthbar
mod_name=Mob Health Bar
mod_version=1.1.0
mod_group_id=com.warwa.mobhealthbar
mod_license=MIT
mod_author=warwa
